# ============================================================
# ConnectPhone - Docker Compose
# ============================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # View app logs
#   docker compose down           # Stop all services
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectphone-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/connectphone.db
    volumes:
      - connectphone-db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  connectphone-db:
    driver: local
